# RL smoke run: 10 RL steps of Qwen3-0.6B against the no-reference Llama-3B judge.
# Measures step time and checks the env loads in prime-rl. On a 2-GPU pod, from prime-rl/:
#   uv run rl @ /root/fj-smoke.toml --dry-run
#   uv run rl @ /root/fj-smoke.toml
max_steps = 10
seq_len = 2048

[model]
name = "Qwen/Qwen3-0.6B"

[weight_broadcast]
type = "filesystem"

[orchestrator]
batch_size = 32

[orchestrator.concurrency]
max_inflight = 32

[orchestrator.renderer]
name = "qwen3"
enable_thinking = false

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "flawed-judge"
env.taskset.id = "flawed-judge"
env.taskset.split = "train"
env.taskset.task.judge_mode = "no_reference"
env.taskset.task.judge.model = "meta-llama/Llama-3.2-3B-Instruct"
env.taskset.task.judge.sampling.temperature = 0.0
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"
env.retries.rules = [{message = "429", max_retries = 3}]

[trainer.optim]
lr = 3e-6

[inference]
