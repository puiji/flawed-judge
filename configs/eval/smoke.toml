# Smoke run: weak policy, weak judge, 20 tasks x 4 attempts.
# uv run vf-eval @ configs/eval/smoke.toml
model = "meta-llama/Llama-3.2-1B-Instruct"
num_rollouts = 4
push = false
output_dir = "outputs"
max_concurrent = 32

[select]
limit = 20

[sampling]
max_tokens = 1024

[env.taskset]
id = "flawed-judge"

[env.taskset.task.judge]
model = "meta-llama/Llama-3.2-3B-Instruct"
sampling = { temperature = 0.0 }

# Single-turn chat on the local machine. The defaults (bash harness, remote
# prime sandbox) send tool definitions, which small models can't serve.
[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "subprocess"

# Judge calls get no client retries (verifiers MAX_RETRIES = 0), so a judge 429
# fails the whole rollout. Retry those rollouts instead.
[[env.retries.rules]]
message = "429"
max_retries = 3
