[project]
name = "flawed-judge"
version = "0.1.1"
description = "flawed-judge — GSM8K scored by an LLM judge, with code-checked truth logged alongside."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enmanuel Felix-Pena" }]
dependencies = ["verifiers>=0.4.0", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flawed_judge"]
